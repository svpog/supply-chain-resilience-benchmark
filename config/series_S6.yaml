# Серія S6: чутливість метрик
# Протокол S6: інформативність і стабільність авторських метрик
# Що варіюємо: α (CVaR), T (горизонт), w (необоротність), ω (composite Q)
# Базується на прогонах S1, S2, S4; нові прогони з w > 0

series: S6
description: "Чутливість авторських метрик до α, T, w, ω"

network:
  N: 50
  H: 4
  c_base: 100
  supply_surplus: 1.2

disruption:
  type: node_failure
  p_v: 0.20

recovery:
  strategy: random
  mu: 1

simulation:
  Q_target_frac: 0.95
  M: 200    # більше прогонів для надійного CVaR

metrics:
  bootstrap_B: 1000

sweep:
  topology:
    - hierarchical
    - reserved
  # Чутливість до рівня CVaR α
  alpha_cvar:
    - 0.05
    - 0.10
    - 0.20
  # Чутливість до горизонту T
  T_max:
    - 50
    - 100
    - 200
  # Чутливість до необоротної частки w
  w:
    - 0.0
    - 0.10
    - 0.25
    - 0.50
  # Чутливість до ваги ω у composite Q(t; ω)
  omega:
    - 0.0    # тільки структурна компонента LCC/N
    - 0.5    # змішана
    - 1.0    # тільки потокова F(t)/F(0) — стандарт
